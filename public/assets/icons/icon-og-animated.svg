<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="192" height="192" viewBox="140 200 760 580" role="img" aria-label="OrmocGo">
  <title>OrmocGo</title>
  <desc>Animated OrmocGo mark — same og design with motion</desc>
  <defs>
    <style>
      <![CDATA[
        svg { background: transparent; }
        .layer {
          transform-box: view-box;
        }
        .radar {
          transform-box: view-box;
          transform-origin: 343px 489px;
          animation: radar 2.4s ease-out infinite;
        }
        .navy {
          transform-origin: 343px 489px;
          animation: navy-in 0.9s cubic-bezier(.2,.8,.2,1) forwards, navy-idle 3.2s ease-in-out 0.9s infinite;
        }
        .inner {
          transform-origin: 343px 489px;
          animation: inner-in 0.7s cubic-bezier(.2,.8,.2,1) 0.15s forwards, inner-idle 2.4s ease-in-out 0.85s infinite;
        }
        .gee {
          transform-origin: 690px 545px;
          animation: g-in 0.85s cubic-bezier(.2,.8,.2,1) 0.28s forwards, g-idle 3.2s ease-in-out 1.1s infinite;
        }
        @keyframes radar {
          0%   { transform: scale(0.45); opacity: 0.5; }
          70%  { transform: scale(1.45); opacity: 0; }
          100% { transform: scale(1.45); opacity: 0; }
        }
        @keyframes navy-in {
          from { transform: scale(0.7); opacity: 0; }
          to   { transform: scale(1); opacity: 1; }
        }
        @keyframes navy-idle {
          0%, 100% { transform: scale(1); }
          50%      { transform: scale(1.04); }
        }
        @keyframes inner-in {
          from { transform: scale(0.2); opacity: 0; }
          to   { transform: scale(1); opacity: 1; }
        }
        @keyframes inner-idle {
          0%, 100% { transform: scale(1); opacity: 1; }
          50%      { transform: scale(0.86); opacity: 0.9; }
        }
        @keyframes g-in {
          from { transform: translateX(36px); opacity: 0; }
          to   { transform: translateX(0); opacity: 1; }
        }
        @keyframes g-idle {
          0%, 100% { transform: translateX(0); }
          50%      { transform: translateX(4px); }
        }
        @media (prefers-reduced-motion: reduce) {
          .radar, .navy, .inner, .gee { animation: none !important; opacity: 1; transform: none; }
        }
      ]]>
    </style>
  </defs>

  <circle class="radar" cx="343" cy="489" r="230" fill="none" stroke="#0079FC" stroke-width="18"/>
  <image class="layer navy" width="1024" height="1024" href="icon-og-layer-navy.png" xlink:href="icon-og-layer-navy.png"/>
  <image class="layer inner" width="1024" height="1024" href="icon-og-layer-ring.png" xlink:href="icon-og-layer-ring.png"/>
  <image class="layer gee" width="1024" height="1024" href="icon-og-layer-g.png" xlink:href="icon-og-layer-g.png"/>
</svg>
