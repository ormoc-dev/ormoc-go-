<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="OrmocGo — community city guide for Ormoc. Local details, places, and helpful tools. Non-profit and ad-free.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OrmocGo">
  <title>OrmocGo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="public/assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="public/assets/icons/icon-192.png">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ormocgo.theme');
        theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/css/layout/theme.css">
  <link rel="stylesheet" href="public/css/app.css">
  <link rel="stylesheet" href="public/css/home.css">
  <link rel="stylesheet" href="public/css/auth/auth.css">
  <link rel="stylesheet" href="public/css/dashboard.css">
  <style>
    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 0%, #d9efff 0%, transparent 42%),
        linear-gradient(180deg, #eef7ff 0%, #f3f9ff 55%, #ffffff 100%);
      color: #5b7390;
      font-family: Figtree, sans-serif;
      transition: opacity 180ms ease;
    }
    .boot-splash.is-done {
      opacity: 0;
      pointer-events: none;
    }
    .boot-splash[hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="app-shell is-booting">
  <div class="boot-splash" id="boot-splash" role="status" aria-live="polite">Loading OrmocGo…</div>
  <div id="sidebar-slot"></div>
  <div class="app-main">
    <div id="header-slot"></div>
    <main id="app" class="main" aria-live="polite"></main>
    <div id="footer-slot"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
