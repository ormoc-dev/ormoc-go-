<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="OrmocGo — community city guide for Ormoc. Local details, places, and helpful tools. Non-profit and ad-free.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OrmocGo">
  <title>OrmocGo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="public/assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="public/assets/icons/icon-192.png">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ormocgo.theme');
        theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/css/layout/theme.css">
  <link rel="stylesheet" href="public/css/app.css">
  <link rel="stylesheet" href="public/css/home.css">
  <link rel="stylesheet" href="public/css/auth/auth.css">
  <link rel="stylesheet" href="public/css/dashboard.css">
  <style>
    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #5b7390;
      font-family: Figtree, sans-serif;
      transition: opacity 180ms ease;
    }
    .boot-splash-inner {
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .boot-splash-logo {
      width: 96px;
      height: 96px;
      display: block;
      overflow: visible;
    }
    .boot-splash-logo .radar {
      transform-box: view-box;
      transform-origin: 343px 489px;
      animation: og-radar 2.4s ease-out infinite;
    }
    .boot-splash-logo .navy {
      transform-box: view-box;
      transform-origin: 343px 489px;
      animation: og-navy-in 0.9s cubic-bezier(.2,.8,.2,1) forwards, og-navy-idle 3.2s ease-in-out 0.9s infinite;
    }
    .boot-splash-logo .inner {
      transform-box: view-box;
      transform-origin: 343px 489px;
      animation: og-inner-in 0.7s cubic-bezier(.2,.8,.2,1) 0.15s forwards, og-inner-idle 2.4s ease-in-out 0.85s infinite;
    }
    .boot-splash-logo .gee {
      transform-box: view-box;
      transform-origin: 690px 545px;
      animation: og-g-in 0.85s cubic-bezier(.2,.8,.2,1) 0.28s forwards, og-g-idle 3.2s ease-in-out 1.1s infinite;
    }
    @keyframes og-radar {
      0%   { transform: scale(0.45); opacity: 0.5; }
      70%  { transform: scale(1.45); opacity: 0; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes og-navy-in {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes og-navy-idle {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    @keyframes og-inner-in {
      from { transform: scale(0.2); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes og-inner-idle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(0.86); opacity: 0.9; }
    }
    @keyframes og-g-in {
      from { transform: translateX(36px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes og-g-idle {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-splash-logo .radar,
      .boot-splash-logo .navy,
      .boot-splash-logo .inner,
      .boot-splash-logo .gee {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
    .boot-splash.is-done {
      opacity: 0;
      pointer-events: none;
    }
    .boot-splash[hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="app-shell is-booting">
  <div class="boot-splash" id="boot-splash" role="status" aria-live="polite">
    <div class="boot-splash-inner">
      <svg class="boot-splash-logo" viewBox="140 200 760 580" width="96" height="96" role="img" aria-label="Loading OrmocGo">
        <circle class="radar" cx="343" cy="489" r="230" fill="none" stroke="#0079FC" stroke-width="18"/>
        <image class="navy" width="1024" height="1024" href="public/assets/icons/icon-og-layer-navy.png"/>
        <image class="inner" width="1024" height="1024" href="public/assets/icons/icon-og-layer-ring.png"/>
        <image class="gee" width="1024" height="1024" href="public/assets/icons/icon-og-layer-g.png"/>
      </svg>
    </div>
  </div>
  <div id="sidebar-slot"></div>
  <div class="app-main">
    <div id="header-slot"></div>
    <main id="app" class="main" aria-live="polite"></main>
    <div id="footer-slot"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
